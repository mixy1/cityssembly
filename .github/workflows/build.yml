name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-mingw-w64-x86-64 libsdl2-2.0-0

      - name: Cache SDL2 (mingw)
        uses: actions/cache@v4
        with:
          path: third_party
          key: sdl2-mingw-2.30.9

      - name: Build Windows
        run: |
          make deps
          make windows

      - name: Build Linux
        run: make linux

      - name: Smoke test (headless new-player playtest)
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./cityssembly --demo 1 playtest.bmp T | tee playtest.txt
          grep -q "powered=" playtest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cityssembly-windows
          path: dist/cityssembly.exe

      - uses: actions/upload-artifact@v4
        with:
          name: cityssembly-linux
          path: cityssembly

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cityssembly.exe
            cityssembly

  web:
    # the same assembly, translated to C and compiled to WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          pip install capstone pyelftools

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build web
        run: ./web/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cityssembly-web
          path: site

      # deploy the Worker serving cityssembly.mixy.one (wrangler.jsonc); needs
      # repo secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit)
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy
